name: CI/CD Quality & Production Delivery Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test_and_audit:
    name: Automated Verification & Unit Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "ci_pipeline_secret_test_key_2026_at_least_32_chars!!"
      RESET_SECRET: "ci_pipeline_secret_test_key_2026_at_least_32_chars!!"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Initialize Prisma Client
        run: npx prisma generate

      - name: Execute Full 23-Group Test Suite (137+ Tests)
        run: npm test

      - name: Static Type Checking
        run: npx tsc --noEmit

      - name: Compile Next.js Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          DATABASE_URL: "file:./dev.db"
          AUTH_SECRET: "ci_pipeline_secret_test_key_2026"
          JWT_SECRET: "ci_pipeline_secret_test_key_2026"

  docker_build:
    name: Build & Verify Production Container
    needs: test_and_audit
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: classroom-erp:latest
