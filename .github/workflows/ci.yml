name: CI / Production Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
      JWT_SECRET: ci-temporary-validation-jwt-secret-key-at-least-32-chars!
      RESET_SECRET: ci-temporary-validation-reset-secret-key-at-least-32-chars!

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install NPM Dependencies
        run: npm ci

      - name: Generate Prisma ORM Client
        run: npx prisma generate

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Execute Automated Test Suite
        run: npm test

      - name: Build Next.js Standalone Production Bundle
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          JWT_SECRET: ci-temporary-validation-jwt-secret-key-at-least-32-chars!
          RESET_SECRET: ci-temporary-validation-reset-secret-key-at-least-32-chars!
          DATABASE_URL: file:./dev.db
